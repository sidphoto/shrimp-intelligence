name: SharBo Globo Public Validation Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Public contract, leak and i18n validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: Check frontend JavaScript syntax
        run: |
          node --check app.js
          node --check i18n.js
          node --check personalization.js
          node --check quick_filters.js
          node --check topic_catalog.js
          node --check exploration.js
          node --check insight_widgets.js
          node --check github_source.js
      - name: Run JavaScript regressions
        run: |
          node tests/test_personalization.mjs
          node tests/test_quick_filters.mjs
          node tests/test_topics.mjs
      - name: Run Python regressions
        run: python -m unittest discover -s tests -v
      - name: Public repository leak gate
        run: python scripts/validate_public_repo.py
      - name: Validate multilingual contract
        run: python scripts/validate_i18n.py
      - name: Validate demo report contract
        run: python scripts/validate_report.py data/latest.json
      - name: Validate public JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path('config/sources.json'),
              Path('config/editorial_profile.json'),
              Path('config/trend_entities.json'),
              Path('config/impact_rules.json'),
              Path('data/index.json'),
              Path('data/latest.json'),
              Path('data/market-live.json'),
              Path('locales/zh-TW.json'),
              Path('locales/en.json'),
              Path('locales/vi-VN.json'),
          ]
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'OK JSON: {path}')
          PY
