name: SharBo Globo — Daily intelligence radar

on:
  schedule:
    # 05:55 Asia/Taipei: capture market snapshot before the strict 06:00 cutoff.
    - cron: "55 21 * * *"
    # 06:15 Asia/Taipei: collect, verify, generate and publish the daily radar.
    - cron: "15 22 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Optional report date in Asia/Taipei (YYYY-MM-DD) for a backfill"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "ops/rerun-trigger.txt"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  market-snapshot:
    if: github.event_name == 'schedule' && github.event.schedule == '55 21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-dateutil
      - name: Capture cutoff-safe market snapshot
        run: python scripts/market_snapshot.py
      - name: Commit market snapshot
        run: |
          git config user.name "SharBo Globo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market-snapshot.json
          if git diff --cached --quiet; then
            echo "No market snapshot changes."
            exit 0
          fi
          git commit -m "data: pre-cutoff market snapshot $(date +%F)"
          git push origin main

  generate:
    if: github.event_name != 'schedule' || github.event.schedule == '15 22 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Taipei
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEWS_DISCOVERY_PROVIDER: tavily
      INTELLIGENCE_MODE: ${{ vars.INTELLIGENCE_MODE || 'deterministic' }}
      OPENAI_FINAL_MODEL: ${{ vars.OPENAI_FINAL_MODEL || 'gpt-5.6' }}
      REPORT_DATE: ${{ inputs.report_date }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check required Tavily secret
        run: |
          if [ -z "$TAVILY_API_KEY" ]; then
            echo "TAVILY_API_KEY is required. Existing latest.json has not been changed."
            exit 1
          fi

      - name: Compile Python
        run: python -m compileall -q scripts tests

      - name: Check frontend JavaScript syntax
        run: |
          node --check app.js
          node --check i18n.js
          node --check personalization.js
          node --check quick_filters.js
          node --check topic_catalog.js
          node --check exploration.js
          node --check insight_widgets.js

      - name: Test personal radar matching
        run: node tests/test_personalization.mjs

      - name: Test quick severity filters
        run: node tests/test_quick_filters.mjs

      - name: Test topic drilldown classification
        run: node tests/test_topics.mjs

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate multilingual contract
        run: python scripts/validate_i18n.py

      - name: Refresh independent live market snapshot
        run: python scripts/market_live.py

      - name: Commit live market snapshot independently
        run: |
          git config user.name "SharBo Globo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market-live.json
          if git diff --cached --quiet; then
            echo "No live market changes."
          else
            git commit -m "data: refresh live market snapshot $(date +%F)"
            git push origin main
          fi

      - name: Generate intelligence report
        id: generate_report
        continue-on-error: true
        run: python scripts/run_daily_radar.py

      - name: Enrich signal region tags
        run: python scripts/enrich_regions.py

      - name: Build emerging signals and impact chains
        run: python scripts/apply_intelligence_extensions.py

      # Even when the report gate blocks, enrich the last-known-good report with
      # the independently captured live market snapshot for the website artifact.
      - name: Apply reader-facing summary and market snapshot
        run: python scripts/enrich_report.py

      - name: Validate deploy artifact
        run: |
          python scripts/validate_i18n.py
          python scripts/validate_report.py data/latest.json

      - name: Commit successful report data
        if: steps.generate_report.outcome == 'success'
        run: |
          git config user.name "SharBo Globo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No report changes to commit. Existing latest.json remains in place."
            exit 0
          fi
          git commit -m "data: daily SharBo Globo radar $(date +%F)"
          git push origin main

      # Deploy from this same run. This also allows a fresh market snapshot to
      # reach the dashboard when intelligence generation is blocked by its gate.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy updated site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Job summary
        run: |
          echo "## SharBo Globo daily run" >> "$GITHUB_STEP_SUMMARY"
          echo "- Discovery provider: **Tavily**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Intelligence mode: **${INTELLIGENCE_MODE}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Report generation outcome: **${{ steps.generate_report.outcome }}**" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path('data/latest.json')
          if p.exists():
              r=json.loads(p.read_text())
              market_ready=sum(1 for x in r.get('market', []) if x.get('value') not in (None, '', '—'))
              print(f"- Report date: **{r.get('date')}**")
              print(f"- Engine: **{r.get('engine_version', 'n/a')}**")
              print(f"- Intelligence extensions: **{r.get('intelligence_extensions_version', 'n/a')}**")
              print(f"- Signals: **{len(r.get('signals', []))}**")
              print(f"- Top 5: **{len(r.get('top5_ids', []))}**")
              print(f"- Emerging signals: **{len(r.get('emerging_signals', []))}**")
              print(f"- Trend history days: **{r.get('trend_meta', {}).get('available_history_days', 0)}**")
              print(f"- Impact chains: **{len(r.get('impact_chains', []))}**")
              print(f"- Region tagging: **{r.get('region_tagging_version', 'n/a')}**")
              print(f"- Market mode: **{r.get('market_meta', {}).get('mode', 'n/a')}**")
              print(f"- Market metrics populated: **{market_ready}/{len(r.get('market', []))}**")
              print(f"- Quality: **{r.get('quality', {}).get('grade', 'n/a')}**")
              print(f"- Window: `{r.get('window', {}).get('start')}` → `{r.get('window', {}).get('end')}` Asia/Taipei")
          PY

      - name: Preserve report gate failure status
        if: steps.generate_report.outcome != 'success'
        run: |
          echo "Intelligence generation was blocked; last-known-good report was preserved while market snapshot was deployed."
          exit 1
