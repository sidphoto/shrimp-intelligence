name: SharBo Globo — Generate daily global intelligence radar

on:
  schedule:
    # 06:15 Asia/Taipei = 22:15 UTC on the previous calendar day.
    # The intelligence cutoff remains fixed at 06:00 Asia/Taipei.
    - cron: "15 22 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Optional report date in Asia/Taipei (YYYY-MM-DD) for a backfill"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Taipei
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEWS_DISCOVERY_PROVIDER: tavily
      INTELLIGENCE_MODE: ${{ vars.INTELLIGENCE_MODE || 'deterministic' }}
      OPENAI_FINAL_MODEL: ${{ vars.OPENAI_FINAL_MODEL || 'gpt-5.6' }}
      REPORT_DATE: ${{ inputs.report_date }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check required Tavily secret
        run: |
          if [ -z "$TAVILY_API_KEY" ]; then
            echo "TAVILY_API_KEY is required. Existing latest.json has not been changed."
            exit 1
          fi

      - name: Compile Python
        run: python -m compileall -q scripts tests

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Generate intelligence report
        run: python scripts/run_daily_radar.py

      - name: Validate generated report
        run: python scripts/validate_report.py data/latest.json

      - name: Commit report data
        run: |
          git config user.name "SharBo Globo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No report changes to commit. Existing latest.json remains in place."
            exit 0
          fi
          git commit -m "data: daily SharBo Globo radar $(date +%F)"
          git push origin main

      # Commits made with GITHUB_TOKEN do not normally trigger another push workflow.
      # Deploy from this same run so the site is refreshed immediately.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy updated site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Job summary
        run: |
          echo "## SharBo Globo daily run" >> "$GITHUB_STEP_SUMMARY"
          echo "- Discovery provider: **Tavily**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Intelligence mode: **${INTELLIGENCE_MODE}**" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path('data/latest.json')
          if p.exists():
              r=json.loads(p.read_text())
              print(f"- Report date: **{r.get('date')}**")
              print(f"- Engine: **{r.get('engine_version', 'n/a')}**")
              print(f"- Signals: **{len(r.get('signals', []))}**")
              print(f"- Top 5: **{len(r.get('top5_ids', []))}**")
              print(f"- Quality: **{r.get('quality', {}).get('grade', 'n/a')}**")
              print(f"- Window: `{r.get('window', {}).get('start')}` → `{r.get('window', {}).get('end')}` Asia/Taipei")
          PY
