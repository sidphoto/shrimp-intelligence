name: Deploy SharBo Globo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validation gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q scripts tests
      - name: Check frontend JavaScript syntax
        run: |
          node --check app.js
          node --check i18n.js
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_i18n.py
      - run: python scripts/validate_report.py data/latest.json

  deploy:
    name: Deploy
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prepare reader-facing report artifact
        run: python scripts/enrich_report.py
      - name: Validate deploy artifact
        run: |
          python scripts/validate_i18n.py
          python scripts/validate_report.py data/latest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
